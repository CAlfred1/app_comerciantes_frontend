<div class="card shadow">

  <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Comprobantes de Cobro</h5>

    <button
      class="btn btn-light"
      routerLink="/comprobantes/nuevo">
      Nuevo Comprobante
    </button>
  </div>

  <div class="card-body">

    <!-- Busqueda -->
    <div class="row mb-3">

      <div class="col-md-9">
        <label class="form-label">
          Buscar por número o tipo
        </label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="filtro"
          placeholder="Escribe número o tipo">
      </div>

      <div class="col-md-3 d-flex align-items-end">
        <button
          class="btn btn-secondary w-100"
          (click)="limpiar()">
          Limpiar
        </button>
      </div>

    </div>

    <!-- Loader -->
    <div *ngIf="loading" class="text-center py-4">
      <div class="spinner-border text-primary"></div>
    </div>

    <!-- Tabla -->
    <div *ngIf="!loading" class="table-responsive">

      <table class="table table-hover table-striped align-middle">

        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Número</th>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Total</th>
            <th>Estado</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let item of comprobantesFiltrados">

            <td>{{ item.id }}</td>
            <td>{{ item.numero }}</td>
            <td>{{ item.fecha | date:'dd/MM/yyyy HH:mm' }}</td>
            <td>{{ item.tipo }}</td>
            <td>S/ {{ item.total }}</td>

            <td>
              <span class="badge bg-success">
                Registrado
              </span>
            </td>

            <td class="text-center">

              <button
                class="btn btn-warning btn-sm"
                [routerLink]="['/comprobantes/editar', item.id]">
                Editar
              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
